<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Học Chữ Hán</title>
<meta name="description" content="Học chữ Hán phồn thể qua bộ thủ, chiết tự, thứ tự nét viết và ngữ pháp từng câu.">
<meta name="theme-color" content="#b5352a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Học Chữ Hán">
<meta property="og:title" content="Học Chữ Hán – hiểu bộ, nhớ chữ, viết đúng nét">
<meta property="og:description" content="Học chữ Hán qua bộ thủ, chiết tự, thứ tự nét viết và ngữ pháp từng câu.">
<meta property="og:image" content="icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=LXGW+WenKai+TC&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="show-py show-hv">
<header class="topbar">
  <div class="brand"><span class="logo hz">漢</span><div><b>Học Chữ Hán</b><small>Hiểu bộ – nhớ chữ – viết đúng nét</small></div></div>
  <nav class="tabs" id="tabs">
    <button data-tab="text" class="active">📜 Toàn văn</button>
    <button data-tab="lessons">📖 Bài học</button>
    <button data-tab="chars">🈶 Chữ Hán</button>
    <button data-tab="radicals">🧩 Bộ thủ</button>
    <button data-tab="grammar">📐 Ngữ pháp</button>
    <button data-tab="review">🃏 Ôn tập</button>
    <button data-tab="write">✍️ Luyện viết</button>
    <button data-tab="custom">➕ Văn bản mới</button>
  </nav>
  <div class="top-right">
    <label class="tgl"><input type="checkbox" id="tglPy" checked> Pinyin</label>
    <label class="tgl"><input type="checkbox" id="tglHv" checked> Hán Việt</label>
    <button class="stats" id="stats" title="Đi tới ôn tập"></button>
  </div>
</header>

<main>
  <section id="tab-text" class="tab active"></section>
  <section id="tab-lessons" class="tab"></section>
  <section id="tab-chars" class="tab"></section>
  <section id="tab-radicals" class="tab"></section>
  <section id="tab-grammar" class="tab"></section>
  <section id="tab-review" class="tab"></section>
  <section id="tab-write" class="tab"></section>
  <section id="tab-custom" class="tab"></section>
</main>

<footer class="foot">
  <span>Dữ liệu nét viết: Hanzi Writer / Make Me a Hanzi. Giải thích chiết tự theo truyền thống, một số là mẹo ghi nhớ.</span>
  <span><button class="link" id="btnVoiceHelp">🔊 Nghe không được?</button> · <button class="link" id="btnExport">⬇ Sao lưu tiến độ</button> · <button class="link" id="btnImport">⬆ Khôi phục</button><input type="file" id="fileImport" accept=".json" hidden></span>
</footer>

<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true">
    <div class="modal-bar">
      <button class="icon-btn" id="modalBack" title="Quay lại">←</button>
      <span class="modal-title" id="modalTitle"></span>
      <button class="icon-btn" data-close title="Đóng (Esc)">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="js/vendor/hanzi-writer.min.js"></script>
<script src="js/data-chars.js"></script>
<script src="js/data-components.js"></script>
<script src="js/data-words.js"></script>
<script src="js/data-grammar.js"></script>
<script src="js/data-audio.js"></script>
<script src="js/data-vi.js"></script>
<script src="js/app.js"></script>
</body>
</html>
